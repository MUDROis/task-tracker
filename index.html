<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Трекер задач</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5/800.css">
<link rel="icon" href="grifon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="grifon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- SheetJS для Excel (CDN с fallback) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        if (typeof XLSX === 'undefined') {
            var s = document.createElement('script');
            s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
            document.head.appendChild(s);
        }
    </script>
    <!-- EmailJS для уведомлений (бесплатно до 200 писем/мес) -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <!-- Firebase SDK (Realtime Database + Auth) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <!-- Firebase конфигурация (создайте свой файл firebase-config.js) -->
    <script src="firebase-config.js"></script>
</head>
<body>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>
    <div id="toastContainer" class="toast-container"></div>
    <div id="app">
        <!-- Страница входа -->
        <div id="loginPage" class="page active">
            <div class="login-container">
                <h1>📋 Вход в систему</h1>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginInput">Логин</label>
                        <input type="text" id="loginInput" placeholder="Введите логин" required>
                    </div>
                    <div class="form-group">
                        <label for="passwordInput">Пароль</label>
                        <input type="password" id="passwordInput" placeholder="Введите пароль" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn primary">Войти</button>
                    <div id="loginError" class="error-message"></div>
                </form>
            </div>
        </div>

        <!-- Основное приложение -->
        <div id="mainPage" class="page">
            <header class="app-header">
                <div class="header-left">
                    <img src="grifon.png" alt="" class="logo-img">
                    <div class="head-text">
                        <div class="head-title-row">
                            <h2>Задачи</h2>
                            <span id="userRoleBadge" class="role-badge">Руководитель</span>
                        </div>
                        <p class="head-sub"><b id="greeting"></b> · <span id="currentDate"></span></p>
                    </div>
                </div>
                <div class="header-right">
                    <div class="ring" id="statsRing" role="img" aria-label="Процент выполненных задач" style="--p:0">
                        <div class="ring-core"><b id="ringPct">0%</b><small>готово</small></div>
                    </div>
                    <button id="logoutBtn" class="btn-logout-inline" title="Выйти" aria-label="Выйти"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </header>

            <!-- Панель управления -->
            <div class="toolbar">
                <button id="addTaskBtn" class="btn primary btn-sm">➕ Новая задача</button>
                <div class="toolbar-settings-group">
                    <button id="toolbarSettingsBtn" class="btn secondary btn-sm">⚙️ Настройки</button>
                    <div id="toolbarSettingsDropdown" class="toolbar-settings-dropdown">
                        <button id="exportBtn" class="toolbar-dropdown-item">📤 Экспорт Excel</button>
                        <button id="importBtn" class="toolbar-dropdown-item">📥 Импорт Excel</button>
                    </div>
                </div>
                <input type="file" id="fileInput" accept=".xlsx" style="display:none">
                <button id="manageUsersBtn" class="btn outline btn-sm" style="display:none;">👥 Управление</button>
                <button id="archiveBtn" class="btn outline btn-sm">🗂 Архив</button>
            </div>

            <!-- Мобильная нижняя панель -->
            <div class="mobile-bar">
                <button id="mobileManageBtn" class="mobile-bar-btn" title="Управление">👥</button>
                <button id="mobileAddBtn" class="mobile-bar-btn mobile-bar-btn-main" title="Новая задача">➕</button>
                <button id="mobileArchiveBtn" class="mobile-bar-btn" title="Архив">🗂</button>
                <div class="mobile-bar-btn-group">
                    <button id="mobileSettingsBtn" class="mobile-bar-btn" title="Настройки">⚙️</button>
                    <div id="mobileSettingsDropdown" class="mobile-settings-dropdown">
                        <button id="mobileExportBtn" class="mobile-dropdown-item">📤 Экспорт Excel</button>
                        <button id="mobileImportBtn" class="mobile-dropdown-item">📥 Импорт Excel</button>
                    </div>
                </div>
            </div>

            <!-- Доска Kanban -->
            <div class="board" id="board">
                <div class="column" data-status="urgent">
                    <div class="column-header">
                        <h3>🍳 Срочные</h3>
                        <span class="count" id="count_urgent">0</span>
                    </div>
                    <div class="task-list" id="list_urgent"></div>
                </div>
                <div class="column" data-status="in_progress">
                    <div class="column-header">
                        <h3>▶️ В работе</h3>
                        <span class="count" id="count_in_progress">0</span>
                    </div>
                    <div class="task-list" id="list_in_progress"></div>
                </div>
                <div class="column" data-status="reports">
                    <div class="column-header">
                        <h3>📄 Отчёты</h3>
                        <div class="column-header-actions">
                            <button id="addReportBtn" class="column-add-btn" title="Новый отчёт">➕</button>
                            <span class="count" id="count_reports">0</span>
                        </div>
                    </div>
                    <div class="task-list" id="list_reports"></div>
                </div>
            </div>
        </div>

        <!-- Модальное окно создания/редактирования задачи -->
        <div id="taskModal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h3 id="modalTitle">Новая задача</h3>
                <form id="taskForm">
                    <input type="hidden" id="taskId">
                    <div class="form-group">
                        <div class="item-type-toggle" id="itemTypeToggle">
                            <button type="button" class="item-type-btn active" data-type="task">Задача</button>
                            <button type="button" class="item-type-btn" data-type="report">Отчёт</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="taskTitle">Заголовок *</label>
                        <input type="text" id="taskTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="taskDesc">Описание</label>
                        <textarea id="taskDesc" rows="3"></textarea>
                    </div>
                    <div class="form-group" id="taskStatusGroup">
                        <label for="taskStatus">Статус</label>
                        <select id="taskStatus">
                            <option value="urgent">Срочные</option>
                            <option value="in_progress" selected>В работе</option>
                            <option value="reports">Отчёт</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">Приоритет</label>
                        <select id="taskPriority">
                            <option value="low">Низкий</option>
                            <option value="medium" selected>Средний</option>
                            <option value="high">Высокий</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskDueDate">Срок выполнения</label>
                        <input type="datetime-local" id="taskDueDate" step="900">
                    </div>
                    <div class="form-group">
                        <label for="taskAssignee">Исполнитель (делегировать)</label>
                        <select id="taskAssignee">
                            <option value="">Не назначен</option>
                        </select>
                    </div>
                    <button type="submit" class="btn primary">Сохранить</button>
                </form>
            </div>
        </div>

        <!-- Модальное окно создания/редактирования отчёта -->
        <div id="reportModal" class="modal">
            <div class="modal-content report-modal">
                <span class="close-modal">&times;</span>
                <h3 id="reportModalTitle">Новый отчёт</h3>
                <form id="reportForm">
                    <input type="hidden" id="reportId">
                    <div class="form-group">
                        <label for="reportTitle">Заголовок *</label>
                        <input type="text" id="reportTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="reportDesc">Описание</label>
                        <textarea id="reportDesc" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="reportStatus">Статус</label>
                        <select id="reportStatus">
                            <option value="urgent">Срочные</option>
                            <option value="in_progress">В работе</option>
                            <option value="reports" selected>Отчёт</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reportPriority">Приоритет</label>
                        <select id="reportPriority">
                            <option value="low">Низкий</option>
                            <option value="medium" selected>Средний</option>
                            <option value="high">Высокий</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reportDueDate">Срок выполнения</label>
                        <input type="datetime-local" id="reportDueDate" step="900">
                    </div>
                    <div class="form-group">
                        <label for="reportAssignee">Исполнитель (делегировать)</label>
                        <select id="reportAssignee">
                            <option value="">Не назначен</option>
                        </select>
                    </div>
                    <button type="submit" class="btn primary">Сохранить</button>
                </form>
            </div>
        </div>

        <!-- Модальное окно управления пользователями -->
        <div id="usersModal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h3>👥 Управление сотрудниками</h3>
                <div id="usersList"></div>
                <hr>
                <h4>Добавить сотрудника</h4>
                <form id="addUserForm">
                    <div class="form-group">
                        <label for="newLogin">Логин</label>
                        <input type="text" id="newLogin" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Пароль</label>
                        <input type="password" id="newPassword" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="newUserEmail">Email для уведомлений</label>
                        <input type="email" id="newUserEmail" placeholder="user@example.com">
                    </div>
                    <button type="submit" class="btn primary">Добавить</button>
                </form>
            </div>
        </div>

        <!-- Модальное окно архива -->
        <div id="archiveModal" class="modal">
            <div class="modal-content archive-content">
                <span class="close-modal">&times;</span>
                <h3>🗂 Архив</h3>
                <div class="archive-toolbar">
                    <div class="archive-tabs">
                        <button class="archive-tab active" data-tab="tasks">Задачи</button>
                        <button class="archive-tab" data-tab="reports">Отчёты</button>
                    </div>
                    <input type="text" id="archiveSearch" placeholder="Поиск…">
                    <button id="archiveExportBtn" class="btn secondary btn-sm">📤 Выгрузить Excel</button>
                </div>
                <div id="archiveList" class="archive-list"></div>
            </div>
        </div>
    </div>
    <script src="js/helpers.js"></script>
    <script src="app.js"></script>
</body>
</html>
